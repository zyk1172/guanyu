name: Deploy Vercel Production

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify this is a stable release from main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production deployment requires a stable vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::The published release tag no longer points to the release event commit."
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Refusing to deploy a release that is not contained in main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.25.4

      - name: Deploy the release to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::Add the VERCEL_TOKEN Actions secret before publishing a stable release."
            exit 1
          fi

          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
